services:
  # 網頁伺服器設定（使用 SQLite 資料庫）
  - type: web
    name: stock-predictor
    runtime: python
    buildCommand: "./build.sh"
    startCommand: gunicorn stock_predictor.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"